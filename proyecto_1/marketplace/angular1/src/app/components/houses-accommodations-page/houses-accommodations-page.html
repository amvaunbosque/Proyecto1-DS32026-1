<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Funnel+Sans:wght@300..800&display=swap" rel="stylesheet">

<section class="registro">
  <button class="filtro-btn" (click)="volver()">← Volver</button>

  <div class="filtros">
    @for (cat of categorias; track cat) {
      <button class="filtro-btn" [class.selected]="categoriaActiva === cat" (click)="seleccionar(cat)">
        {{ cat }}
      </button>
    }
  </div>

  <div class="cards-destinos">
    @for (a of visibles; track a.id) {
      <article class="card-destino" [routerLink]="['/detalle/casas', a.id]">
        <span class="card-tag top-right">{{ a.precio }}</span>
        <span class="card-tag top-left rating">☆ {{ a.calificacion }}</span>
        <img [src]="a.imagen" [alt]="a.nombre">
        <div class="card-info">
          <span class="card-tag name">{{ a.nombre }}</span>
          <span class="card-tag location">{{ a.ciudad }}, {{ a.pais }}</span>
        </div>
      </article>
    } @empty {
      <p>No hay alojamientos en esta categoría.</p>
    }
  </div>

  @if (visibles.length < filtrados.length) {
    <div class="fila-titulo">
      <a href="#" class="ver-mas" (click)="verMas(); $event.preventDefault()">Ver más...</a>
    </div>
  }
</section>
